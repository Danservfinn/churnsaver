<svg role="img" aria-labelledby="loading-title loading-desc" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title id="loading-title">Loading</title>
  <desc id="loading-desc">An animated loading spinner illustration</desc>
  <defs>
    <linearGradient id="loading-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>
  </defs>
  
  <!-- Spinner circles -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#loading-accent)" stroke-width="8" opacity="0.2" />
  <circle cx="100" cy="100" r="40" fill="none" stroke="url(#loading-accent)" stroke-width="6" opacity="0.4" />
  <circle cx="100" cy="100" r="20" fill="url(#loading-accent)" opacity="0.6" />
</svg>



